name: Logica CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logica-production
  cancel-in-progress: false

jobs:
  build:
    name: Compile, bundle and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run bundle
      - run: npm run test:server
      - run: npm run test:component


  deploy:
    name: Dispatch private deployment
    needs: build
    if: github.ref == 'refs/heads/main' && vars.LOGICA_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger private deployment workflow
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.LOGICA_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          : "${DEPLOY_TOKEN:?Missing LOGICA_DEPLOY_TOKEN}"
          jq -n --arg sha "$GITHUB_SHA" '{ref:"main",inputs:{sha:$sha}}' |
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $DEPLOY_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/json" \
              --data-binary @- \
              https://api.github.com/repos/Donnarieix/logica-deploy/actions/workflows/deploy.yml/dispatches
